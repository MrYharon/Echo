<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Echo - Prompt Coach</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #0f172a;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-deep: #0284c7;
      --border: rgba(56, 189, 248, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
    }
    .title { font-weight: 700; font-size: 14px; color: #ffffff; }
    .subtitle { color: var(--accent); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    
    .status-banner {
      padding: 10px 16px;
      background: rgba(56, 189, 248, 0.08);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
    }
    .status-banner span.key {
      font-family: ui-monospace, monospace;
      padding: 2px 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: var(--accent);
      font-weight: 600;
      font-size: 11px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .rules-header {
      padding: 10px 16px 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
    }
    .rules { padding: 4px 0 8px; }
    .rule-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 16px;
      transition: background 0.15s ease;
    }
    .rule-row:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .rule-row label { color: #cbd5e1; cursor: pointer; font-size: 12px; }
    .footer {
      padding: 10px 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      background: #070b14;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">E</div>
    <div>
      <div class="title">Echo - Prompt Coach</div>
      <div class="subtitle">Grammarly for AI</div>
    </div>
  </div>
  <div class="status-banner">
    <span>Quick Auto-Correct</span>
    <span class="key">Alt+E</span>
  </div>
  <div class="toggle-row">
    <span>Real-time Coaching</span>
    <input type="checkbox" id="enabled" />
  </div>
  <div class="rules-header">Active Evaluation Rules</div>
  <div class="rules" id="rules"></div>
  <div class="footer">
    Works locally on ChatGPT, Gemini, and Claude. Zero data sent to external servers.
  </div>
  <script src="popup.js"></script>
</body>
</html>
